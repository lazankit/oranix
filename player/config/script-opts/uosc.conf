# ---- Oranix look: orange + charcoal, Poppins, clay + glass (dock drawn by scripts\clay-dock.lua) ----
color=foreground=ff7a00,foreground_text=ffffff,background=1f1f1f,background_text=ffffff,curtain=111111,success=ffa94d,error=ff616e
opacity=timeline=0.25,position=1,chapters=0.6,slider=0.8,slider_gauge=1,controls=0.16,speed=0.6,menu=0.9,submenu=0.5,border=0,title=0.6,tooltip=0.9,thumbnail=1,curtain=0.45
border_radius=14
font_scale=1
text_border=1

# ---- Bottom bar ----
controls=menu,gap,open-file,cycle:pause:pause:no/yes=play_arrow?Play/Pause,command:replay_10:seek -10?Back 10s,command:forward_10:seek 10?Forward 10s,gap,prev,next,space,command:speed:script-binding track_popup/speed?Playback speed,gap,command:subtitles:script-binding track_popup/toggle?Audio & Subtitles,gap,items,gap,fullscreen
controls_size=32
controls_margin=14
controls_spacing=8
timeline_style=bar
timeline_size=26
timeline_border=0
timeline_step=5
# Thin red progress line always visible, even when controls are hidden
progress=always
progress_size=3
# Right-hand time shows how much is left (like -41:59)
destination_time=time-remaining
volume=right
volume_size=34
volume_border=0

# ---- Top bar ----
top_bar=no-border
top_bar_size=36
window_border_size=0

# ---- Motion ----
animation_duration=120
flash_duration=900
pause_indicator=flash

# ---- Laptop-friendly ----
timeline_persistency=paused
controls_persistency=paused
top_bar_persistency=paused
proximity_in=80
proximity_out=200

# Oranix draws its own start screen (scripts\oranix-idle.lua); hide uosc's so they don't overlap
disable_elements=idle_indicator
