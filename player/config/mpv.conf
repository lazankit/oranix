# Use uosc's Netflix-style controls instead of mpv's built-in ones
osc=no
osd-bar=no
border=no
# Window opens at 70% of the screen, remembers where you stopped
keep-open=yes
save-position-on-quit=yes
# Preferred track languages
slang=en,eng
alang=en,eng

# Faster: GPU decoding/rendering via Direct3D 11, skip the YouTube loader at startup
vo=gpu-next
gpu-api=d3d11
hwdec=d3d11va
ytdl=no
cache=yes
demuxer-max-bytes=150MiB


# Volume can go up to 200% (boosts like VLC)
volume-max=200
# Window opens centred at 80% of the screen and keeps that shape; video is centred inside
autofit=80%
geometry=50%:50%
keepaspect-window=no
snap-window=yes

# ---- Oranix branding ----
title=${?media-title:${media-title} - }Oranix Player
osd-font=Poppins
osd-font-size=34
osd-color='#FFFFFF'
osd-border-color='#B0000000'
osd-border-size=1.5
osd-shadow-offset=1
