# --- Playback ---
SPACE       cycle pause; script-binding uosc/flash-timeline
k           cycle pause; script-binding uosc/flash-timeline
LEFT        seek -5;  script-binding uosc/flash-timeline
RIGHT       seek 5;   script-binding uosc/flash-timeline
Shift+LEFT  seek -30; script-binding uosc/flash-timeline
Shift+RIGHT seek 30;  script-binding uosc/flash-timeline
[           add speed -0.25; script-binding uosc/flash-speed
]           add speed 0.25;  script-binding uosc/flash-speed
BS          set speed 1;     script-binding uosc/flash-speed

# --- Volume ---
Ctrl+m      cycle mute;    script-binding uosc/flash-volume
UP       script-binding scroll_zones/vol-up
DOWN     script-binding scroll_zones/vol-down

# --- Brightness (goes down to -100, darker than the laptop minimum) ---
n           script-binding scroll_zones/bright-down
m           script-binding scroll_zones/bright-up
Ctrl+0      script-binding scroll_zones/bright-reset

# --- Screen & menus (use arrows + Enter inside menus, Esc to close) ---
f           cycle fullscreen
ENTER       cycle fullscreen
s           script-binding track_popup/toggle
v           cycle sub
a           script-binding track_popup/toggle
e           script-binding uosc/playlist
TAB         script-binding uosc/menu
Ctrl+o      script-binding uosc/open-file
?           script-binding uosc/keybinds

# --- Episodes ---
>           script-binding uosc/next
<           script-binding uosc/prev

# --- Touchpad scroll (natural direction): left half = brightness, right half = volume ---
WHEEL_UP    script-binding scroll_zones/down
WHEEL_DOWN  script-binding scroll_zones/up

# --- Subtitle switch: strictly on/off (English or last picked) ---
c           script-binding track_popup/toggle-subs

# --- Tap video = play/pause, double tap = fullscreen ---
MBTN_LEFT     cycle pause; script-binding uosc/flash-pause-indicator
MBTN_LEFT_DBL script-binding window_clicks/double-click

# --- Same keys on the number-pad arrows (NumLock off) ---
KP_UP       script-binding scroll_zones/vol-up
KP_DOWN     script-binding scroll_zones/vol-down
KP_LEFT     seek -5;  script-binding uosc/flash-timeline
KP_RIGHT    seek 5;   script-binding uosc/flash-timeline

# --- Sideways two-finger scroll = seek 1s (throttled) ---
WHEEL_LEFT  script-binding scroll_zones/right
WHEEL_RIGHT script-binding scroll_zones/left
# --- Speed picker ---
x           script-binding track_popup/speed
